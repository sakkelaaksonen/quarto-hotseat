<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Quarto Hot Seat</title>
    <script type="module" src="quarto-ui.js"></script>
    <link rel="stylesheet" href="quarto.css">
  </head>
  <body>
    <div class="root">

      <div class="button-container">
        <h2>Quarto Hot Seat: </h2>
        <span id="js-instructions" class="instructions"></span>
        <a id="js-start" class="button" href="?">Restart</a>
        <button type="button" class="button" id="js-quarto">Quarto</button>
        <button type="button" class="button" id="js-draw" hidden>Draw</button>
        <p id="js-message" class="message" aria-live="polite"></p>
      </div>
      <div class="pieces" id="js-pieces"></div>
      <div id="js-grid" class="grid">

        <div class="grid-cell js-grid-cell" data-row="0" data-column="0"></div>
        <div class="grid-cell js-grid-cell" data-row="0" data-column="1"></div>
        <div class="grid-cell js-grid-cell" data-row="0" data-column="2"></div>
        <div class="grid-cell js-grid-cell" data-row="0" data-column="3"></div>

        <div class="grid-cell js-grid-cell" data-row="1" data-column="0"></div>
        <div class="grid-cell js-grid-cell" data-row="1" data-column="1"></div>
        <div class="grid-cell js-grid-cell" data-row="1" data-column="2"></div>
        <div class="grid-cell js-grid-cell" data-row="1" data-column="3"></div>

        <div class="grid-cell js-grid-cell" data-row="2" data-column="0"></div>
        <div class="grid-cell js-grid-cell" data-row="2" data-column="1"></div>
        <div class="grid-cell js-grid-cell" data-row="2" data-column="2"></div>
        <div class="grid-cell js-grid-cell" data-row="2" data-column="3"></div>

        <div class="grid-cell js-grid-cell" data-row="3" data-column="0"></div>
        <div class="grid-cell js-grid-cell" data-row="3" data-column="1"></div>
        <div class="grid-cell js-grid-cell" data-row="3" data-column="2"></div>
        <div class="grid-cell js-grid-cell" data-row="3" data-column="3"></div>

      </div>
      <div class="playbox" id="js-playbox"></div>

    </div>
  </body>
</html>
